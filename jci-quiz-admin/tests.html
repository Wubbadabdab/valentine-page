<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automated checks · JCI Uniben Quiz Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <!-- Theme before first paint: identical copy of js/theme-init.js -->
  <script>(function(){try{var t=localStorage.getItem('jci-admin-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main id="main" class="app-main">
    <div class="page">
      <header class="page-header">
        <div class="page-header__titles">
          <h1>Automated checks</h1>
          <p class="page-header__description">Small tests for the admin site's logic. Open this page through a local web server.</p>
        </div>
      </header>
      <div class="card">
        <p class="text-muted" data-test-summary role="status">Running…</p>
        <ol class="test-results" data-test-results></ol>
      </div>
    </div>
  </main>
  <script type="module" src="js/tests/run.js"></script>
</body>
</html>
